<section class="login-form">
    <h1>Connexion</h1>
    
    <p> Pour t'entraîner : emilys / emilyspass</p>

    <form [formRoot]="logginForm">
           
        <app-text-field
            inputId="username"
            label="Nom d'utilisateur"
            type="text"
            [formField]="logginForm.username"
        />

        <app-text-field
            inputId="password"
            label="Mot de passe"
            type="password"
            [formField]="logginForm.password"
        />

        @if (error(); as message) {
            <p class="error">{{ message }}</p>
        }

        <app-button type="submit">Se connecter</app-button>
    </form> 
</section>
