<section class="product-form">
  <h2>Ajouter un produit</h2>

  <form [formRoot]="productForm">
    <app-text-field
        id="title"
        label="Nom du produit"
        type="text"
        [formField]="productForm.title"
    />

    <app-text-field
        id="price"
        label="Prix (€)"
        type="number"
        [formField]="productForm.price"
    />

    <app-text-field
        id="stock"
        label="Stock"
        type="number"
        [formField]="productForm.stock"
    />

    <app-button type="submit">Ajouter</app-button>
  </form>

  @if (created(); as product) {
    <p>✅ Prêt à envoyer au serveur :</p>
    <pre>{{ product | json }}</pre>
  }
</section>
