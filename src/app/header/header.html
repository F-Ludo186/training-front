<header class="header">
  <h1>Training Shop</h1>
  <p>Le catalogue d'entraînement</p>

  <p>🛒 {{ cart.count() }} article(s) pour un total de {{ cart.total().toFixed(2) }} €</p>
  <p>{{ shipping() }}</p>
  <button (click)="cart.clear()">Vider le panier</button>
  
  <nav class="main-nav">
    <a routerLink="/">Accueil</a>
    <a routerLink="/account">Mon compte</a>

    <a routerLink="/products/new">Ajouter un produit</a>
    @if(auth.isLoggedIn(); as loggedIn) {
      <a class="auth-link" routerLink="/login" (click)="auth.logout()">
        <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24">
          <path d="M14 7l5 5-5 5M19 12H9M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
        </svg>
        Déconnexion
      </a>
    } @else {
      <a class="auth-link" routerLink="/login">
        <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24">
          <path d="M10 7l-5 5 5 5M5 12h10M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
        </svg>
        Connexion
      </a>
    }
  </nav>
</header>
